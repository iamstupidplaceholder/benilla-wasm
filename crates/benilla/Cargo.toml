[package]
name = "benilla"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher: build.rs stamps the git build id, main() hands it to benilla-app. A shim, so the stamp's every-commit rebuild dirties this package and not the app crate (decision 0993)"

[lints]
workspace = true

[features]
# Preview builds contain only the player client.
default = []

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "benilla"
path = "src/main.rs"
# No tests live here — and test-building this bin would relink the whole app in the test profile
# on every sha change, which is the exact tax the shim exists to kill (decision 0993).
test = false
