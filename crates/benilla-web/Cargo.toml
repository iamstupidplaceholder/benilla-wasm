[package]
name = "benilla-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser entry point for the incremental Benilla web port"

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["default_font"] }
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-lua = { path = "../benilla-lua" }
benilla-ui = { path = "../benilla-ui" }
benilla-formats = { path = "../benilla-formats" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "UrlSearchParams", "Window"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[[bin]]
name = "benilla-web"
path = "src/main.rs"
test = false
