[package]
name = "benilla-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-free WoW UI engine core: TOC/FrameXML parsing, templates, anchors, z-order — decision 0068"

[lints]
workspace = true

[dependencies]
roxmltree = "0.20"
benilla-framexml = { path = "../benilla-framexml" }
# One VM boundary: rilua on every target. `mlua-backend` stays available inside
# `benilla-lua` as an opt-in comparison mode, but nothing outside that crate may
# enable it or depend on `mlua` — backend selection belongs only to `benilla-lua`.
benilla-lua = { path = "../benilla-lua" }
benilla-time.workspace = true
benilla-settings = { path = "../benilla-settings" }
